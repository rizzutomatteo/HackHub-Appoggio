spring.application.name=hackhub
server.port=8080
# Google Calendar (opzionale: senza, usa fallback in-memory)
google.calendar.credentials=
google.calendar.id=primary
# Stripe test (opzionale: senza, usa fallback in-memory). Metti una sk_test_... per attivare
stripe.api-key=

# Le chiavi reali NON vanno qui (questo file e' versionato). Vengono lette da
# application-local.properties (ignorato da git), se presente nella working directory.
# Le property del file locale sovrascrivono quelle qui sopra.
spring.config.import=optional:file:./application-local.properties
